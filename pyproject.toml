[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-x"
version = "0.1.0"
description = "Autonomous trading research, validation and strategy evolution engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyyaml>=6.0", "scipy>=1.10", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
